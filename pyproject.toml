[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "unit-jit"
version = "0.5.0"
description = "JIT unit-stripping decorator: write Pint-annotated code, run at float speed"
authors = [{ name = "Matthias Függer" }]
readme = "README.md"
requires-python = ">=3.13"
license = { text = "Apache-2.0" }
dependencies = [
    "pint>=0.25.3",
    "libcst>=1.9.0",
    "numpy>=2.5.3",
]

[project.optional-dependencies]
numba = ["numba>=0.67.0"]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "pintrs>=0.4.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/unit_jit"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"
extraPaths = ["src"]
exclude = ["tests", "examples", "benchmarks", ".venv"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
